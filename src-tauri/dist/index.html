<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Keystone</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        background: #f7f5f2;
        color: #1c1a17;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #17140f;
          color: #f2ece2;
        }
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        max-width: 420px;
        text-align: center;
        padding: 32px;
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: linear-gradient(135deg, #b08d57, #7a6136);
      }
      h1 {
        font-size: 20px;
        margin: 0;
        font-weight: 600;
      }
      #status {
        font-size: 14px;
        opacity: 0.75;
        min-height: 20px;
      }
      .spinner {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 3px solid rgba(122, 97, 54, 0.25);
        border-top-color: #7a6136;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #retry {
        display: none;
        margin-top: 4px;
        padding: 8px 18px;
        border-radius: 8px;
        border: none;
        background: #7a6136;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      #retry:hover {
        opacity: 0.9;
      }
      #detail {
        font-size: 12px;
        opacity: 0.6;
        max-width: 360px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark"></div>
      <h1>Keystone startet…</h1>
      <div class="spinner" id="spinner"></div>
      <div id="status">Initialisiere…</div>
      <div id="detail"></div>
      <button id="retry">Erneut versuchen</button>
    </div>
    <script>
      // Populated by Rust via `window.emit("startup-status", { stage, message, error })`.
      // Kept deliberately dependency-free (no bundler) since this page only
      // exists as a splash/status screen shown before the real Next.js app
      // (served by the sidecar) takes over the window.
      const statusEl = document.getElementById("status");
      const detailEl = document.getElementById("detail");
      const spinnerEl = document.getElementById("spinner");
      const retryEl = document.getElementById("retry");

      function applyStatus(payload) {
        statusEl.textContent = payload.message || "";
        detailEl.textContent = payload.detail || "";
        if (payload.stage === "error") {
          spinnerEl.style.display = "none";
          retryEl.style.display = "inline-block";
        } else {
          spinnerEl.style.display = "block";
          retryEl.style.display = "none";
        }
      }

      retryEl.addEventListener("click", () => {
        applyStatus({ stage: "starting", message: "Starte erneut…" });
        if (window.__TAURI__) {
          window.__TAURI__.core.invoke("retry_startup");
        }
      });

      if (window.__TAURI__) {
        window.__TAURI__.event.listen("startup-status", (event) => applyStatus(event.payload));
      }
    </script>
  </body>
</html>
